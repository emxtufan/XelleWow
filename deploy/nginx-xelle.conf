# /etc/nginx/sites-available/xelle.ro — xelle.ro through Cloudflare (Full strict,
# Cloudflare Origin Certificate) to the pm2 processes in ecosystem.config.cjs.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xelle.ro www.xelle.ro;

    ssl_certificate     /etc/ssl/xelle/origin.pem;
    ssl_certificate_key /etc/ssl/xelle/origin.key;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location = /__local/status { return 404; }

    # GitHub webhook: Payload URL https://xelle.ro/__deploy
    location = /__deploy {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:9000/deploy;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
